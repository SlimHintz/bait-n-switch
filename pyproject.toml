[project]
name = "baitnswitch"
version = "2.0.0"
description = "Clickbait headline classifier with a JSON API and an in-browser Chrome extension"
readme = "README.md"
authors = [{ name = "Tim Hintz", email = "tjhintz@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "flask>=3.0",
    "gunicorn>=22.0",
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baitnswitch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
